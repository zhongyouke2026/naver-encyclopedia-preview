<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선전시 행정구역</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    --paper:  #FCFBF9;
    --ink:    #16191D;
    --muted:  #8A8781;
    --rule:   rgba(0, 0, 0, 0.05);
    --sea:    #f8fafc;
    --accent: #2E5A4C;

    --sans: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    --serif: "Nanum Myeongjo", "Apple SD Gothic Neo", "Songti SC", "SimSun", serif;
  }

  * { box-sizing: border-box; }

  /* 클릭 시 브라우저 기본 포커스 테두리 제거 */
  :focus { outline: none; }
  svg *:focus { outline: none; }
  * { -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: transparent;
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    width: 100%;
    height: 100%;
  }

  .plate {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    position: relative;
    overflow: hidden;
  }

  /* ── 도판 머리글 ───────────────────────── */
  .head { padding: 8px 12px 10px; }

  .eyebrow {
    font-family: var(--serif);
    font-size: 10px;
    letter-spacing: .34em;
    color: var(--muted);
    margin-bottom: 6px;
    display: none; /* Hide Chinese eyebrow */
  }

  .titlerow {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.035em;
  }
  .hint { font-size: 11px; color: var(--muted); letter-spacing: -.01em; }

  /* ── 지도 ──────────────────────────────── */
  .field {
    margin: 4px 12px 0;
    background: var(--sea);
    border: 1px solid var(--rule);
    border-radius: 16px;
    position: relative;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    max-height: 280px;
  }
  svg.map {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
  }

  .dist {
    stroke: var(--paper);
    stroke-width: .7;
    stroke-linejoin: round;
    cursor: pointer;
    transition: fill .35s ease, opacity .35s ease;
  }
  .dist:focus { outline: none; }
  .dist:focus-visible { outline: none; stroke: var(--accent); stroke-width: 1.4; }

  /* 선택 시: 고른 구만 색을 지키고 나머지는 물러난다 */
  svg.map.picked .dist          { fill: #E4E2DD; }
  svg.map.picked .dist.on       { stroke: var(--accent); stroke-width: 1.3; }
  svg.map.picked .dlab          { fill: #A8A5A0; }
  svg.map.picked .dlab.on       { fill: var(--ink); font-size: 5.6px; }

  .dlab {
    font-family: var(--sans);
    font-size: 4.7px;
    font-weight: 600;
    letter-spacing: -.04em;
    fill: #3B4148;
    text-anchor: middle;
    pointer-events: none;
    paint-order: stroke;
    stroke: rgba(252,251,249,.9);
    stroke-width: 1.7px;
    stroke-linejoin: round;
    transition: fill .35s ease, font-size .35s ease;
  }

  .furn { fill: none; stroke: #9AA3A6; stroke-width: .55; }
  .furntext {
    font-family: var(--sans);
    font-size: 3.6px;
    font-weight: 500;
    letter-spacing: .02em;
    fill: #8B9497;
    text-anchor: middle;
  }

  .foot {
    padding: 10px 12px 4px;
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--muted);
  }
  .foot b { font-weight: 600; color: #6E6B66; }

  

  @media (max-width: 460px) {
    .head { padding: 18px 18px 14px; }
    h1 { font-size: 20px; }
    .field { margin: 4px 12px 0; }
    .foot, .detail { padding-left: 18px; padding-right: 18px; }
    .detail { margin-left: 18px; margin-right: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dist, .dlab { transition: none; }
  }
</style>
</head>

      hintEl.textContent = '지도의 구(区)를 선택하면 하이라이트됩니다';
      hintEl.style.color = 'var(--muted)';
      hintEl.style.fontWeight = '400';
    }
  });
</script>
