<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선전시 대표 기업 지도</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
    }

    /* Container holding the map card */
    .widget-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      padding: 16px;
      position: relative;
    }

    /* Header title */
    .widget-header {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .widget-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .widget-title svg {
      width: 16px;
      height: 16px;
      color: #3b82f6;
    }
    .widget-subtitle {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }

    /* Map viewport container */
    .map-container {
      width: 100%;
      flex-grow: 1;
      position: relative;
      background: #f8fafc;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    /* Background image stretching to cover container */
    .map-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* Company Pins (Floating Cutouts) */
    .company-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 3;
      transition: all 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .company-pin:hover, .company-pin.active {
      transform: translate(-50%, -50%) scale(1.1);
      z-index: 5;
    }
    
    /* Clean transparent cutout container */
    .company-logo-container {
      width: 46px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .company-logo-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.12));
    }
    
    .company-label {
      margin-top: 4px;
      font-size: 9.5px;
      font-weight: 800;
      color: #1e293b;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(0, 0, 0, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      white-space: nowrap;
    }
    .company-pin:hover .company-label, .company-pin.active .company-label {
      background: #3b82f6;
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.35);
    }

    /* Floating Popover Balloon */
    .district-popover {
      position: absolute;
      width: 290px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      z-index: 10;
      pointer-events: auto;
      transition: opacity 0.25s, transform 0.25s;
    }
    .popover-close {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #94a3b8;
      cursor: pointer;
      transition: color 0.2s;
    }
    .popover-close:hover {
      color: #475569;
    }

    .district-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 2px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .district-hanja {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
    }
    
    .district-meta {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .meta-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .badge-code {
      background: #f1f5f9;
      color: #475569;
    }
    .badge-streets {
      background: #eff6ff;
      color: #2563eb;
    }

    .district-desc {
      font-size: 11.5px;
      line-height: 1.6;
      color: #334155;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 8px;
      border-left: 3px solid #3b82f6;
    }
  </style>
</head>
<body>

  <div class="widget-wrapper">
    <!-- Header -->
    <div class="widget-header">
      <div class="widget-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
        </svg>
        선전시 대표 기업 본사 지도
      </div>
      <div class="widget-subtitle">기업 로고를 클릭하시면 상세 정보가 표시됩니다</div>
    </div>

    <!-- Map Viewport -->
    <div class="map-container" id="mapContainer">
      <img src="./images/shenzhen_map_base.jpg" alt="선전시 행정구역 기본도" class="map-image">

      <!-- Company Pins -->
      <div class="company-pin" id="pin-huawei" style="left: 48.0%; top: 45.0%;" onclick="showCompany('huawei', event)">
        <div class="company-logo-container">
          <img src="./images/logo_huawei.png" class="company-logo-img" alt="화웨이">
        </div>
        <div class="company-label">화웨이</div>
      </div>

      <div class="company-pin" id="pin-tencent" style="left: 20.0%; top: 62.0%;" onclick="showCompany('tencent', event)">
        <div class="company-logo-container">
          <img src="./images/logo_tencent.png" class="company-logo-img" alt="텐센트">
        </div>
        <div class="company-label">텐센트</div>
      </div>

      <div class="company-pin" id="pin-byd" style="left: 74.0%; top: 42.0%;" onclick="showCompany('byd', event)">
        <div class="company-logo-container">
          <img src="./images/logo_byd.png" class="company-logo-img" alt="비야디">
        </div>
        <div class="company-label">비야디</div>
      </div>

      <div class="company-pin" id="pin-pingan" style="left: 36.0%; top: 73.0%;" onclick="showCompany('pingan', event)">
        <div class="company-logo-container">
          <img src="./images/logo_pingan.png" class="company-logo-img" alt="중국핑안">
        </div>
        <div class="company-label">중국핑안</div>
      </div>

      <div class="company-pin" id="pin-cmb" style="left: 43.0%; top: 70.0%;" onclick="showCompany('cmb', event)">
        <div class="company-logo-container">
          <img src="./images/logo_cmb.png" class="company-logo-img" alt="자오상은행">
        </div>
        <div class="company-label">자오상은행</div>
      </div>

      <!-- Floating Popover Balloon -->
      <div class="district-popover" id="districtPopover" style="display: none;">
        <div class="popover-close" onclick="closePopover()">×</div>
        <div class="district-title" id="popoverTitle">기업명 <span class="district-hanja" id="popoverHanja">한자</span></div>
        <div class="district-meta">
          <span class="meta-badge badge-streets" id="popoverCode">분야</span>
          <span class="meta-badge badge-code" id="popoverStreets">홈페이지</span>
        </div>
        <div class="district-desc" id="popoverDesc">기업 설명</div>
      </div>
    </div>
  </div>

  <script>
    const COMPANIES_DATA = {
      'huawei': {
        name: '화웨이',
        hanja: 'Huawei, 华为',
        code: '분야: 통신장비 · 단말',
        streets: '홈페이지: huawei.com',
        desc: '1987년 선전에서 창업한 세계 최대의 통신 장비 제조 기업이다. 룽강구 반텐(坂田)에 거대한 연구 개발형 본사 캠퍼스가 위치하고 있다.'
      },
      'tencent': {
        name: '텐센트',
        hanja: 'Tencent, 腾讯',
        code: '분야: 인터넷 · 게임',
        streets: '홈페이지: tencent.com',
        desc: '1998년 창업한 중국 최대의 메신저(위챗, QQ) 및 모바일 게임 개발 기업이다. 남산구 하이테크 파크의 텐센트 빌딩과 텐센트 씨프런트 타워가 본사다.'
      },
      'byd': {
        name: '비야디',
        hanja: 'BYD, 比亚迪',
        code: '분야: 전기차 · 배터리',
        streets: '홈페이지: byd.com',
        desc: '1995년 배터리 제조사로 창업하여 세계 1위 수준의 전기자동차 제조사로 성장한 대기업이다. 핑산구에 거대한 본사 연구소 및 생산기지를 보유하고 있다.'
      },
      'pingan': {
        name: '중국핑안',
        hanja: 'Ping An, 中国平安',
        code: '분야: 보험 · 금융',
        streets: '홈페이지: pingan.cn',
        desc: '1988년 선전 셰코우에서 창업하여 세계 최대 규모의 금융지주사로 성장한 보험·금융 그룹이다. 푸톈구 CBD의 초고층 랜드마크인 핑안 파이낸스 센터가 본사다.'
      },
      'cmb': {
        name: '자오상은행',
        hanja: '招商银行',
        code: '분야: 은행',
        streets: '홈페이지: cmbchina.com',
        desc: '1987년 셰코우 산업개발과 연계하여 선전 셰코우에서 설립된 민영 상업은행이다. 푸톈구의 자오상은행 타워를 중심으로 선전 금융업의 한 축을 이룬다.'
      }
    };

    function showCompany(id, event) {
      if (event) event.stopPropagation();
      document.querySelectorAll('.company-pin').forEach(p => p.classList.remove('active'));
      const d = COMPANIES_DATA[id];
      if (!d) return;

      const activePin = document.getElementById('pin-' + id);
      if (activePin) activePin.classList.add('active');

      document.getElementById('popoverTitle').innerHTML = d.name + ' <span class="district-hanja">' + d.hanja + '</span>';
      document.getElementById('popoverCode').textContent = d.code;
      document.getElementById('popoverStreets').textContent = d.streets;
      document.getElementById('popoverDesc').textContent = d.desc;

      const popover = document.getElementById('districtPopover');
      popover.style.display = 'block';

      const container = document.getElementById('mapContainer');
      const rect = container.getBoundingClientRect();
      
      const pin = document.getElementById('pin-' + id);
      const leftPct = parseFloat(pin.style.left);
      const topPct = parseFloat(pin.style.top);

      const targetX = (leftPct / 100) * rect.width;
      const targetY = (topPct / 100) * rect.height;

      let popoverX = targetX + 22;
      let popoverY = targetY - 70;

      if (popoverX + 290 > rect.width) {
        popoverX = targetX - 312;
      }
      if (popoverX < 0) {
        popoverX = 10;
      }
      if (popoverY + 160 > rect.height) {
        popoverY = rect.height - 170;
      }
      if (popoverY < 0) {
        popoverY = 10;
      }

      popover.style.left = popoverX + 'px';
      popover.style.top = popoverY + 'px';
    }

    function closePopover() {
      document.getElementById('districtPopover').style.display = 'none';
      document.querySelectorAll('.company-pin').forEach(p => p.classList.remove('active'));
    }

    document.getElementById('mapContainer').addEventListener('click', (e) => {
      if (e.target.className === 'map-image' || e.target.id === 'mapContainer') {
        closePopover();
      }
    });

    window.addEventListener('load', () => {
      setTimeout(() => {
        showCompany('huawei');
      }, 300);
    });
  </script>
</body>
</html>
