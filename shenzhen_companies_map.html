<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선전시 대표 기업 본사</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root {
    --paper:#FCFBF9; --ink:#16191D; --muted:#8A8781; --rule:#E6E3DD;
    --sea:#E9EEF0; --land:#EFEDE8; --landline:#DFDCD5; --accent:#2E5A4C;
    --sans:"Pretendard Variable",Pretendard,system-ui,sans-serif;
    --serif:"Nanum Myeongjo","Apple SD Gothic Neo","Songti SC","SimSun",serif;
  }
  *{box-sizing:border-box}

  /* 클릭 시 브라우저 기본 포커스 테두리 제거 (키보드 이동 표시는 아래에서 따로 유지) */
  :focus { outline: none; }
  svg *:focus { outline: none; }
  * { -webkit-tap-highlight-color: transparent; }

  body{margin:0;background:transparent;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  .plate{background:var(--paper);border:1px solid var(--rule);border-radius:3px}

  .head{padding:22px 26px 18px}
  .eyebrow{font-family:var(--serif);font-size:11px;letter-spacing:.34em;color:var(--muted);margin-bottom:9px}
  .titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.035em}
  .hint{font-size:11.5px;color:var(--muted)}

  .field{margin:4px 18px 0;background:var(--sea);border:1px solid var(--rule);border-radius:2px}
  svg.map{display:block;width:100%;height:auto}

  .dist{fill:var(--land);stroke:var(--landline);stroke-width:.6;stroke-linejoin:round}
  .dlab{font-size:4.1px;font-weight:500;letter-spacing:-.03em;fill:#A8A49D;text-anchor:middle;pointer-events:none}

  .mk{cursor:pointer}
  .mk-halo{fill:var(--paper);opacity:.92}
  .mk-dot{fill:#5A6E66;transition:fill .25s ease,r .25s ease}
  .mk-no{font-size:3.5px;font-weight:700;fill:#fff;text-anchor:middle;pointer-events:none;letter-spacing:-.02em}
  .mk:hover .mk-dot{fill:var(--accent)}
  .mk:focus,.mk:focus-visible{outline:none}
  .mk:focus-visible .mk-halo{stroke:var(--accent);stroke-width:.9}
  .mk.on .mk-dot{fill:var(--accent);r:4.3}

  .foot{padding:11px 26px 0;font-size:11px;line-height:1.65;color:var(--muted)}

  .key{margin:16px 26px 0;padding:0;list-style:none;
       display:grid;grid-template-columns:repeat(3,1fr);gap:1px 18px}
  .row{display:flex;align-items:baseline;gap:8px;padding:6px 0;cursor:pointer;
       border-bottom:1px solid transparent;transition:border-color .2s ease}
  .row:hover,.row:focus-visible{outline:none;border-bottom-color:var(--rule)}
  .row:focus{outline:none}
  .badge{flex:none;width:17px;height:17px;border-radius:50%;background:#EDEBE6;color:#5A6E66;
         font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
         font-variant-numeric:tabular-nums;transition:background .2s ease,color .2s ease}
  .row.on .badge{background:var(--accent);color:#fff}
  .rname{font-size:13px;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
  .rsec{font-size:10.5px;color:var(--muted);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .detail{margin:18px 26px 22px;padding-top:16px;border-top:1px solid var(--rule)}
  .d-guide{font-size:12.5px;color:var(--muted)}
  /* 상세 패널 로고: 높이를 고정해 폭이 제각각인 로고도 줄이 맞게 */
  .d-top{display:flex;align-items:center;gap:13px;margin-bottom:11px}
  .d-logo{flex:none;height:26px;width:auto;max-width:104px;object-fit:contain;
          object-position:left center;display:block}
  .d-logo.missing{display:none}
  .d-name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
  .d-ko{font-size:18px;font-weight:700;letter-spacing:-.035em}
  .d-cn{font-family:var(--serif);font-size:12.5px;color:var(--muted)}
  .d-meta{display:flex;gap:18px;flex-wrap:wrap;padding-bottom:11px;margin-bottom:11px;
          border-bottom:1px solid var(--rule);font-size:11.5px;color:var(--muted)}
  .d-meta b{font-weight:600;color:#4A4F55;margin-left:5px}
  .d-desc{font-size:13.5px;line-height:1.85;letter-spacing:-.015em;color:#3A4048}

  @media (max-width:640px){ .key{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:460px){
    .head{padding:18px 18px 14px} h1{font-size:20px}
    .field{margin:4px 12px 0}
    .foot,.key,.detail{margin-left:18px;margin-right:18px;padding-left:0;padding-right:0}
    .key{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){ .mk-dot,.badge,.row{transition:none} }
</style>
</head>

  const detail = document.getElementById('detail');

  function pick(id) {
    const c = COMPANIES[id];
    if (!c) return;

    document.querySelectorAll('.mk, .row').forEach(function (el) {
      el.classList.toggle('on', el.dataset.id === id);
    });

    const category = c.code.split(': ')[1] || c.code;
    const website = c.streets.split(': ')[1] || '—';
    const note = c.note || '';

    let websiteHtml = '홈페이지 <b>—</b>';
    if (website !== '—') {
      const fullUrl = website.startsWith('http') ? website : 'https://www.' + website;
      websiteHtml = '홈페이지 <b><a href="' + fullUrl + '" target="_blank" style="color: #2E5A4C; text-decoration: underline; font-weight: 600;">' + website + '</a></b>';
    }

    detail.innerHTML =
      '<div class="d-top">' +
        '<img class="d-logo" src="./images/logo_' + id + '.png" alt="' + c.name + ' 로고" ' +
             'onerror="this.classList.add(\'missing\')">' +
        '<div class="d-name"><span class="d-ko">' + c.name + '</span>' +
        '<span class="d-cn">' + c.hanja + '</span></div>' +
      '</div>' +
      '<div class="d-meta">' +
        '<span>분야 <b>' + category + '</b></span>' +
        '<span>' + websiteHtml + '</span>' +
        '<span>비고 <b>' + note + '</b></span>' +
      '</div>' +
      '<div class="d-desc">' + c.desc + '</div>';
  }

  document.querySelectorAll('.mk, .row').forEach(function (el) {
    el.addEventListener('click', function () { pick(el.dataset.id); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(el.dataset.id); }
    });
  });
</script>
