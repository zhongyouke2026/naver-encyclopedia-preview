<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선전시 3D 월별 기후 시각화</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      user-select: none;
    }

    .climate-container {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      padding: 12px;
      position: relative;
    }

    @media (max-width: 768px) {
      .climate-container {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 180px;
        gap: 8px;
        padding: 6px;
      }
    }

    /* 3D Viewport */
    .viewport-area {
      position: relative;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }

    #climateCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Interactive Timeline Controls */
    .timeline-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      max-width: 95%;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .timeline-bar::-webkit-scrollbar {
      display: none;
    }

    .play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }
    .play-btn:hover {
      background: #1d4ed8;
      transform: scale(1.05);
    }
    .play-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .months-list {
      display: flex;
      gap: 4px;
    }

    .month-chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .month-chip:hover {
      background: rgba(0, 0, 0, 0.04);
      color: #334155;
    }
    .month-chip.active {
      background: #2563eb;
      color: white;
      box-shadow: 0 3px 8px rgba(37, 99, 235, 0.2);
    }

    /* Details Panel */
    .details-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }

    @media (max-width: 768px) {
      .details-card {
        padding: 12px;
        border-radius: 16px;
      }
    }

    .card-header {
      margin-bottom: 12px;
    }
    .kicker {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #2563eb;
      margin-bottom: 4px;
    }
    .month-title {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .month-season {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(0, 0, 0, 0.03);
      padding: 10px;
      border-radius: 10px;
    }
    .stat-lbl {
      font-size: 9px;
      color: #64748b;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .stat-val {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
    }

    .desc-box {
      font-size: 12px;
      line-height: 1.55;
      color: #475569;
      background: rgba(37, 99, 235, 0.02);
      border-left: 3px solid #2563eb;
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 12px;
    }

    .wind-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.015);
      border: 1px dashed rgba(0,0,0,0.08);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 11px;
      color: #475569;
    }
    .wind-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #eff6ff;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* Helper label for 3D */
    .help-tooltip {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 5;
      background: rgba(255, 255, 255, 0.85);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.06);
      font-size: 10px;
      color: #64748b;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="climate-container">
    <!-- Left: 3D Visualization Area -->
    <div class="viewport-area" id="stage">
      <div class="help-tooltip">💡 기둥을 클릭하거나 드래그하여 3D 기후 링 회전</div>
      <canvas id="climateCanvas"></canvas>
      
      <!-- Timeline Controller Overlay -->
      <div class="timeline-bar">
        <button class="play-btn" id="btnPlay" title="연간 변화 자동 재생">
          <!-- Play Icon -->
          <svg viewBox="0 0 24 24" id="playSvg"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="months-list" id="monthChips">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </div>

    <!-- Right: Detailed Weather Card -->
    <div class="details-card">
      <div class="card-header">
        <div class="kicker" id="weatherKicker">선전의 아열대 기후</div>
        <div class="month-title">
          <span id="txtMonth">7월</span>
          <span class="month-season" id="txtSeason">한여름 (우기)</span>
        </div>
      </div>

      <div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-lbl">평균 기온</div>
            <div class="stat-val" id="txtTemp">29.0℃</div>
          </div>
          <div class="stat-box">
            <div class="stat-lbl">평균 강수량</div>
            <div class="stat-val" id="txtRain">320mm</div>
          </div>
        </div>

        <div class="desc-box" id="txtDesc">
          여름은 평균 202일에 이를 만큼 매우 길고 고온다습하며, 남풍 계열이 불며 대기 불안정으로 소나기와 집중 태풍이 자주 발생하는 시기입니다.
        </div>
      </div>

      <div class="wind-card">
        <div class="wind-icon" id="windArrow">↓</div>
        <div>
          <strong>계절풍 방향:</strong> <span id="txtWind">남풍 (우기 집중형)</span><br>
          <span style="font-size:9px;color:#94a3b8;">고온 다습한 덥고 습한 남서 계절풍 유입</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Import map for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 12 Months Climate Dataset for Shenzhen
    const CLIMATE_DATA = [
      { month: 1, name: '1월', temp: 15.7, rain: 30, wind: '북동풍', season: '겨울 (건조기)', windDir: '↑', desc: '선전에서 가장 추운 달이지만 한국의 초봄과 유사해 온화합니다. 강수가 적고 매우 건조한 북동풍이 붑니다.' },
      { month: 2, name: '2월', temp: 16.8, rain: 45, wind: '북동풍', season: '겨울 (건조기)', windDir: '↑', desc: '대체로 맑고 서늘하며 비가 많이 오지 않아 쾌적합니다. 여전히 북동풍의 지배 하에 건조함이 계속됩니다.' },
      { month: 3, name: '3월', temp: 19.7, rain: 80, wind: '동풍', season: '봄 (전이기)', windDir: '↗', desc: '봄철 과도기로 기온 변화가 극도로 크며, 더웠다 추웠다를 반복합니다. 습도가 올라가고 안개가 자주 낍니다.' },
      { month: 4, name: '4월', temp: 23.4, rain: 170, wind: '남풍', season: '봄 (우기시작)', windDir: '↓', desc: '여름 우기의 도입부로 강수량이 크게 늘어납니다. 온난하고 습한 남풍이 본격적으로 불기 시작합니다.' },
      { month: 5, name: '5월', temp: 26.7, rain: 310, wind: '남풍', season: '초여름 (우기)', windDir: '↓', desc: '본격적인 여름철로 진입하며 기온이 크게 오릅니다. 남쪽으로부터 매우 덥고 습한 대량의 강수가 유입됩니다.' },
      { month: 6, name: '6월', temp: 28.2, rain: 340, wind: '남풍', season: '여름 (우기)', windDir: '↓', desc: '길고 끈적한 장마철로 연중 일조시간이 비교적 짧고 다습합니다. 남서 계절풍이 불어옵니다.' },
      { month: 7, name: '7월', temp: 29.0, rain: 320, wind: '남풍', season: '한여름 (우기)', windDir: '↓', desc: '가장 더운 달로 평균 29도에 달합니다. 맹렬한 대기 불안정으로 잦은 소나기와 집중 태풍이 지나갑니다.' },
      { month: 8, name: '8월', temp: 28.8, rain: 350, wind: '남풍', season: '한여름 (태풍기)', windDir: '↓', desc: '가장 강수량이 많은 달 중 하나입니다. 남서 계절풍과 더불어 열대성 저기압(태풍)이 자주 내습합니다.' },
      { month: 9, name: '9월', temp: 27.9, rain: 250, wind: '북동풍', season: '늦여름 (우기말)', windDir: '↑', desc: '우기의 마지막 달로 무더위가 지속되지만, 월말부터 바람 방향이 건조한 북동풍 계열로 돌아서기 시작합니다.' },
      { month: 10, name: '10월', temp: 25.2, rain: 60, wind: '북동풍', season: '가을 (건조기)', windDir: '↑', desc: '최고의 계절로 꼽힙니다. 가을철 북동풍이 유입되어 매우 청명하고 선선하며 맑은 날이 이어집니다.' },
      { month: 11, name: '11월', temp: 21.4, rain: 35, wind: '북동풍', season: '가을 (건조기)', windDir: '↑', desc: '선선하고 온화하며 야외 활동을 하기에 가장 쾌적합니다. 맑고 건조한 바람이 불어 비가 거의 오지 않습니다.' },
      { month: 12, name: '12월', temp: 17.5, rain: 25, wind: '북동풍', season: '겨울 (건조기)', windDir: '↑', desc: '맑고 서늘한 겨울로 접어듭니다. 영하로 내려가지 않아 온화하지만 강수가 거의 없는 건조기가 지속됩니다.' }
    ];

    // State
    let activeMonthIndex = 6; // Default to July
    let isPlaying = false;
    let playInterval = null;

    // ThreeJS Globals
    let renderer, scene, camera, controls;
    let pillars = [];
    let activePillarGlow = null;
    let weatherGlobe = null;
    let particleSystem = null;
    let currentWeatherType = '';

    const stage = document.getElementById('stage');
    const canvas = document.getElementById('climateCanvas');

    // Setup UI Elements
    function initUI() {
      const chipsContainer = document.getElementById('monthChips');
      chipsContainer.innerHTML = '';
      
      CLIMATE_DATA.forEach((data, idx) => {
        const chip = document.createElement('button');
        chip.className = `month-chip ${idx === activeMonthIndex ? 'active' : ''}`;
        chip.textContent = data.name;
        chip.addEventListener('click', () => {
          stopPlay();
          selectMonth(idx);
        });
        chipsContainer.appendChild(chip);
      });

      document.getElementById('btnPlay').addEventListener('click', togglePlay);
      updateInfoCard();
    }

    function selectMonth(idx) {
      activeMonthIndex = idx;
      
      // Update UI chips
      const chips = document.querySelectorAll('.month-chip');
      chips.forEach((c, i) => {
        c.classList.toggle('active', i === idx);
      });

      updateInfoCard();
      highlightPillar(idx);
      updateWeatherParticles(CLIMATE_DATA[idx]);

      // Move camera target to selected month slightly
      const angle = (idx / 12) * Math.PI * 2 - Math.PI / 2;
      const radius = 22;
      const tx = Math.cos(angle) * radius;
      const tz = Math.sin(angle) * radius;
      
      // Smoothly slide OrbitControls target to look near the selected pillar
      gsap_lerp_target(tx * 0.4, 0, tz * 0.4);
    }

    function updateInfoCard() {
      const d = CLIMATE_DATA[activeMonthIndex];
      document.getElementById('txtMonth').textContent = d.name;
      document.getElementById('txtSeason').textContent = d.season;
      document.getElementById('txtTemp').textContent = `${d.temp.toFixed(1)}℃`;
      document.getElementById('txtRain').textContent = `${d.rain}mm`;
      document.getElementById('txtDesc').textContent = d.desc;
      document.getElementById('txtWind').textContent = d.wind;
      
      const arrow = document.getElementById('windArrow');
      arrow.textContent = d.windDir;
      // Rotate wind arrow UI
      if (d.windDir === '↓') arrow.style.transform = 'rotate(0deg)';
      else if (d.windDir === '↑') arrow.style.transform = 'rotate(180deg)';
      else arrow.style.transform = 'rotate(135deg)';
    }

    // Auto Play loop
    function togglePlay() {
      const btn = document.getElementById('btnPlay');
      if (isPlaying) {
        stopPlay();
      } else {
        isPlaying = true;
        btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
        btn.style.background = '#e74c3c';
        btn.style.boxShadow = '0 4px 10px rgba(231, 76, 60, 0.25)';
        
        playInterval = setInterval(() => {
          let nextIdx = (activeMonthIndex + 1) % 12;
          selectMonth(nextIdx);
        }, 1800);
      }
    }

    function stopPlay() {
      if (!isPlaying) return;
      isPlaying = false;
      const btn = document.getElementById('btnPlay');
      btn.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;"><path d="M8 5v14l11-7z"/></svg>';
      btn.style.background = '#2563eb';
      btn.style.boxShadow = '0 4px 10px rgba(37, 99, 235, 0.25)';
      clearInterval(playInterval);
    }

    // Custom Orbit target interpolation
    let targetLookAt = new THREE.Vector3(0, 0, 0);
    function gsap_lerp_target(x, y, z) {
      targetLookAt.set(x, y, z);
    }

    // Three.js Core
    function initThree() {
      // Renderer - transparent to match Naver page background!
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(stage.clientWidth, stage.clientHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      scene = new THREE.Scene();
      
      // Camera
      camera = new THREE.PerspectiveCamera(38, stage.clientWidth / stage.clientHeight, 0.1, 1000);
      camera.position.set(0, 36, 52);

      // Controls
      controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 25;
      controls.maxDistance = 100;
      controls.maxPolarAngle = Math.PI * 0.45; // prevent looking below floor
      controls.minPolarAngle = Math.PI * 0.05;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight1.position.set(20, 40, 10);
      dirLight1.castShadow = true;
      dirLight1.shadow.mapSize.width = 1024;
      dirLight1.shadow.mapSize.height = 1024;
      dirLight1.shadow.bias = -0.001;
      scene.add(dirLight1);

      const fillLight = new THREE.DirectionalLight(0xdbeafe, 0.4);
      fillLight.position.set(-20, 20, -10);
      scene.add(fillLight);

      // Ground plane grid
      const grid = new THREE.GridHelper(50, 24, 0xdddddd, 0xefefef);
      grid.position.y = -0.05;
      scene.add(grid);

      // Create 3D Climate elements
      buildClimatePillars();
      buildWeatherGlobe();

      // Trigger default
      selectMonth(activeMonthIndex);

      window.addEventListener('resize', onWindowResize);
      
      // Raycasting for clicking pillars
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        
        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects(pillars, true);
        
        if (intersects.length > 0) {
          stopPlay();
          // Find hit pillar parent group index
          let hitObj = intersects[0].object;
          while (hitObj.parent && hitObj.parent !== scene) {
            hitObj = hitObj.parent;
          }
          const hitIdx = pillars.indexOf(hitObj);
          if (hitIdx !== -1) {
            selectMonth(hitIdx);
          }
        }
      });
    }

    // Build Circular 3D Pillar Chart
    function buildClimatePillars() {
      const radius = 22;
      const count = 12;

      for (let i = 0; i < count; i++) {
        const d = CLIMATE_DATA[i];
        const angle = (i / count) * Math.PI * 2 - Math.PI / 2; // Start from top (-Y)

        const group = new THREE.Group();
        group.position.x = Math.cos(angle) * radius;
        group.position.z = Math.sin(angle) * radius;

        // Pillar height mapped to Temperature (15.7 to 29)
        const minTemp = 10;
        const height = (d.temp - minTemp) * 0.7; // scale height
        
        // Color gradient from Cool (deep cyan-blue) to Hot (orange-red)
        const t = (d.temp - 15.7) / (29 - 15.7);
        const col = new THREE.Color();
        if (t < 0.5) {
          col.copy(new THREE.Color('#4ea8de')).lerp(new THREE.Color('#ffb703'), t * 2);
        } else {
          col.copy(new THREE.Color('#ffb703')).lerp(new THREE.Color('#e63946'), (t - 0.5) * 2);
        }

        // Cylinder mesh
        const geom = new THREE.CylinderGeometry(1.2, 1.2, height, 16);
        // Move pivot to base of cylinder
        geom.translate(0, height / 2, 0);

        const mat = new THREE.MeshStandardMaterial({
          color: col,
          roughness: 0.15,
          metalness: 0.1,
          transparent: true,
          opacity: 0.85
        });

        const cylinder = new THREE.Mesh(geom, mat);
        cylinder.castShadow = true;
        cylinder.receiveShadow = true;
        group.add(cylinder);

        // Subtly float precipitation indicator inside/on-top
        // Rain represented by a transparent blue cap on top
        const rainH = d.rain * 0.015;
        const rainGeom = new THREE.CylinderGeometry(1.25, 1.25, rainH, 16);
        rainGeom.translate(0, height + rainH / 2 + 0.1, 0);
        const rainMat = new THREE.MeshStandardMaterial({
          color: 0x2563eb,
          roughness: 0.05,
          metalness: 0.8,
          transparent: true,
          opacity: 0.7
        });
        const rainMesh = new THREE.Mesh(rainGeom, rainMat);
        group.add(rainMesh);

        // Add 3D text number mesh for month (1 ~ 12)
        // Since custom font loading in 3D is heavy, we'll draw month index as a flat circular marker under it
        const diskGeom = new THREE.CylinderGeometry(1.5, 1.5, 0.1, 24);
        diskGeom.translate(0, 0.05, 0);
        const diskMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.5 });
        const disk = new THREE.Mesh(diskGeom, diskMat);
        group.add(disk);

        scene.add(group);
        pillars.push(group);
      }

      // Add a selection highlight ring
      const ringGeom = new THREE.RingGeometry(2.3, 2.6, 24);
      ringGeom.rotateX(-Math.PI/2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x2563eb, side: THREE.DoubleSide, transparent: true, opacity: 0 });
      activePillarGlow = new THREE.Mesh(ringGeom, ringMat);
      activePillarGlow.position.y = 0.05;
      scene.add(activePillarGlow);
    }

    function highlightPillar(idx) {
      const p = pillars[idx];
      activePillarGlow.position.x = p.position.x;
      activePillarGlow.position.z = p.position.z;
      activePillarGlow.material.opacity = 1.0;

      // Animate active status
      pillars.forEach((group, i) => {
        const cyl = group.children[0];
        if (i === idx) {
          cyl.material.opacity = 1.0;
          cyl.scale.set(1.15, 1.0, 1.15);
        } else {
          cyl.material.opacity = 0.55;
          cyl.scale.set(1.0, 1.0, 1.0);
        }
      });
    }

    // Build the 3D Weather Globe in the center
    function buildWeatherGlobe() {
      const group = new THREE.Group();
      group.position.set(0, 6, 0);

      // Glass sphere casing
      const sphereGeom = new THREE.SphereGeometry(6, 32, 32);
      const sphereMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.12,
        roughness: 0.05,
        transmission: 0.9, // high refraction glass
        thickness: 1.0,
        side: THREE.DoubleSide
      });
      const casing = new THREE.Mesh(sphereGeom, sphereMat);
      group.add(casing);

      // Globe metal stand
      const standGeom = new THREE.CylinderGeometry(3.5, 4.0, 0.4, 32);
      standGeom.translate(0, -6.2, 0);
      const standMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.2, metalness: 0.8 });
      const stand = new THREE.Mesh(standGeom, standMat);
      group.add(stand);

      scene.add(group);
      weatherGlobe = group;
    }

    // 3D Weather particle system inside the globe
    function updateWeatherParticles(d) {
      // Clean previous system
      if (particleSystem) {
        weatherGlobe.remove(particleSystem);
      }

      currentWeatherType = d.season;

      // Make weather indicators
      const particleCount = 180;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const velocities = [];

      let particleColor = 0xffffff;
      let particleSize = 0.15;
      
      const isRainy = d.rain >= 150;
      const isSpring = d.month === 3;
      const isDry = d.rain < 100;

      for (let i = 0; i < particleCount; i++) {
        // Random point inside sphere (radius 5.5)
        const u = Math.random();
        const v = Math.random();
        const theta = u * 2.0 * Math.PI;
        const phi = Math.acos(2.0 * v - 1.0);
        const r = Math.cbrt(Math.random()) * 5.2; // slightly smaller than sphere casing

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta);
        const z = r * Math.cos(phi);

        positions[i * 3] = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        if (isRainy) {
          // Rain falling downwards rapidly
          velocities.push(new THREE.Vector3((Math.random() - 0.5) * 0.05, -0.15 - Math.random() * 0.1, (Math.random() - 0.5) * 0.05));
          particleColor = 0x58a6ff;
          particleSize = 0.08;
        } else if (isSpring) {
          // Spring mist, floating lazily
          velocities.push(new THREE.Vector3((Math.random() - 0.5) * 0.03, (Math.random() - 0.5) * 0.03, (Math.random() - 0.5) * 0.03));
          particleColor = 0xccdcf0;
          particleSize = 0.24; // larger fog particles
        } else {
          // Dry wind swirling
          velocities.push(new THREE.Vector3(Math.sin(theta) * 0.04, (Math.random() - 0.5) * 0.02, -Math.cos(theta) * 0.04));
          particleColor = 0xffd166;
          particleSize = 0.12;
        }
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      
      // Custom material using transparent circular point textures
      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(8,8,0, 8,8,8);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,16,16);
      const texture = new THREE.CanvasTexture(canvas);

      const material = new THREE.PointsMaterial({
        color: particleColor,
        size: particleSize,
        map: texture,
        transparent: true,
        opacity: isSpring ? 0.45 : 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particleSystem = new THREE.Points(geometry, material);
      particleSystem.userData = { velocities: velocities };
      weatherGlobe.add(particleSystem);
      
      // Update sun/rain visual helpers
      animateWeatherElements(isRainy, isSpring, isDry, d.temp);
    }

    // Dynamic meshes inside weather globe
    let weatherSunMesh = null;
    let weatherCloudMesh = null;

    function animateWeatherElements(isRainy, isSpring, isDry, temp) {
      // Remove previous meshes
      if (weatherSunMesh) weatherGlobe.remove(weatherSunMesh);
      if (weatherCloudMesh) weatherGlobe.remove(weatherCloudMesh);

      // Create Sun if hot/dry
      if (isDry || temp > 25) {
        const sunGeom = new THREE.SphereGeometry(1.4, 16, 16);
        const sunMat = new THREE.MeshBasicMaterial({
          color: temp > 28 ? 0xe74c3c : 0xffb703,
          transparent: true,
          opacity: 0.9
        });
        weatherSunMesh = new THREE.Mesh(sunGeom, sunMat);
        weatherSunMesh.position.set(0, 2.5, 0);
        weatherGlobe.add(weatherSunMesh);
      }

      // Create Rain Cloud if wet
      if (isRainy) {
        // Group of spheres to look like a cloud
        const cloudGroup = new THREE.Group();
        const cloudMat = new THREE.MeshStandardMaterial({
          color: 0x475569,
          roughness: 0.9,
          transparent: true,
          opacity: 0.8
        });

        const mainS = new THREE.Mesh(new THREE.SphereGeometry(1.6, 12, 12), cloudMat);
        mainS.position.set(0, 3.2, 0);
        cloudGroup.add(mainS);

        const leftS = new THREE.Mesh(new THREE.SphereGeometry(1.1, 12, 12), cloudMat);
        leftS.position.set(-1.4, 2.9, 0);
        cloudGroup.add(leftS);

        const rightS = new THREE.Mesh(new THREE.SphereGeometry(1.1, 12, 12), cloudMat);
        rightS.position.set(1.4, 2.9, 0);
        cloudGroup.add(rightS);

        weatherCloudMesh = cloudGroup;
        weatherGlobe.add(weatherCloudMesh);
      }
    }

    function onWindowResize() {
      camera.aspect = stage.clientWidth / stage.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(stage.clientWidth, stage.clientHeight);
    }

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      controls.update();

      // Lerp Orbit Target smoothly to active month
      controls.target.lerp(targetLookAt, 0.05);

      // Rotate weather globe stand and meshes gently
      if (weatherGlobe) {
        // stand rotation
        weatherGlobe.children[1].rotation.y += 0.005;
        
        if (weatherSunMesh) {
          // Pulse the sun
          const s = 1.0 + Math.sin(Date.now() * 0.005) * 0.12;
          weatherSunMesh.scale.set(s, s, s);
        }

        if (weatherCloudMesh) {
          // Float the cloud gently
          weatherCloudMesh.position.y = Math.sin(Date.now() * 0.002) * 0.15;
        }
      }

      // Update particle physics inside weather globe
      if (particleSystem) {
        const pos = particleSystem.geometry.attributes.position;
        const count = pos.count;
        const vels = particleSystem.userData.velocities;

        for (let i = 0; i < count; i++) {
          let x = pos.getX(i);
          let y = pos.getY(i);
          let z = pos.getZ(i);
          const vel = vels[i];

          // Apply velocity
          x += vel.x;
          y += vel.y;
          z += vel.z;

          // Boundary checks: wrap particles inside a sphere radius of 5.0
          const dist = Math.sqrt(x*x + y*y + z*z);
          if (dist > 5.2) {
            // Re-spawn near top or randomly inside
            if (currentWeatherType.includes('우기')) {
              // Re-spawn rain at top of sphere
              x = (Math.random() - 0.5) * 5.0;
              y = 3.5 + Math.random() * 1.5;
              z = (Math.random() - 0.5) * 5.0;
            } else {
              // Wrap by reversing or centering
              x = -x * 0.95;
              y = -y * 0.95;
              z = -z * 0.95;
            }
          }

          pos.setXYZ(i, x, y, z);
        }
        pos.needsUpdate = true;
      }

      // Auto rotation of the climate ring when not manual interaction
      if (!controls.state === -1 && !isPlaying) {
        // slowly spin scene
      }

      renderer.render(scene, camera);
    }

    // Initialize UI and ThreeJS
    initUI();
    initThree();
    animate();

  </script>
</body>
